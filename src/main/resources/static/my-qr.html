<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Digital QR Pass</title>
    <!-- Include qrcode.js library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .pass-card { background: white; width: 350px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); text-align: center; }
        h2 { color: #333; margin-bottom: 5px; }
        .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin: 15px 0; }
        .active { background: #d4edda; color: #155724; }
        .deactive { background: #f8d7da; color: #721c24; }
        #qrcode { margin: 20px auto; display: flex; justify-content: center; }
        select { width: 100%; padding: 10px; margin-bottom: 15px; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; }
        .user-id { font-family: monospace; color: #666; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="pass-card">
        <h2>Digital QR Pass</h2>
        <p style="color: #777; font-size: 14px;">Select your user profile to view your pass</p>
        
        <select id="userSelect" onchange="loadUserQR()">
            <option value="">-- Choose User --</option>
        </select>

        <div id="userInfo" style="display: none;">
            <div id="userName" style="font-size: 20px; font-weight: bold; color: #007bff; margin-top: 10px;"></div>
            <div class="user-id" id="userIdDisplay"></div>
            <div id="statusBadge" class="status-badge deactive">DEACTIVE</div>
            
            <!-- QR Code Box -->
            <div id="qrcode"></div>
            
            <div style="font-size: 12px; color: #888; margin-top: 10px;">
                Last Scanned: <span id="lastScannedDisplay">Never</span>
            </div>
        </div>
    </div>

    <script>
        let usersList = [];

        async function fetchUsersForDropdown() {
            try {
                let response = await fetch('/api/users');
                usersList = await response.json();
                let select = document.getElementById('userSelect');
                select.innerHTML = '<option value="">-- Choose User --</option>';
                
                usersList.forEach(user => {
                    let opt = document.createElement('option');
                    opt.value = user.id;
                    opt.textContent = user.name + " (" + user.id + ")";
                    select.appendChild(opt);
                });
            } catch (e) {
                console.error("Error loading users:", e);
            }
        }

        function loadUserQR() {
            let selectedId = document.getElementById('userSelect').value;
            let infoDiv = document.getElementById('userInfo');
            
            if (!selectedId) {
                infoDiv.style.display = 'none';
                return;
            }

            let user = usersList.find(u => u.id === selectedId);
            if (!user) return;

            document.getElementById('userName').innerText = user.name;
            document.getElementById('userIdDisplay').innerText = user.id;
            
            let badge = document.getElementById('statusBadge');
            badge.className = "status-badge " + (user.status === 'ACTIVE' ? 'active' : 'deactive');
            badge.innerText = user.status;

            document.getElementById('lastScannedDisplay').innerText = user.lastScanned || 'Never';

            // Render QR code dynamically
            let qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            new QRCode(qrContainer, {
                text: user.id,
                width: 180,
                height: 180
            });

            infoDiv.style.display = 'block';
        }

        // Load users on startup and poll every 3 seconds to update status live if scanned
        window.onload = function() {
            fetchUsersForDropdown();
            setInterval(async () => {
                let response = await fetch('/api/users');
                usersList = await response.json();
                let selectedId = document.getElementById('userSelect').value;
                if (selectedId) {
                    loadUserQR(); // Refresh view if status changes
                }
            }, 3000);
        };
    </script>
</body>
</html>
