<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Camera & Status Indicator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
    <style>
        #reader {
            border: none !important;
            background: transparent !important;
        }
        #reader video {
            object-fit: cover;
            border-radius: 1.5rem;
        }
    </style>
</head>
<body id="bodyBg" class="bg-blue-900 min-h-screen flex flex-col items-center justify-center text-center p-6 transition-colors duration-300">

    <!-- MAIN CONTAINER -->
    <div class="max-w-md w-full bg-white/10 backdrop-blur-md rounded-3xl border-4 border-white/30 p-6 shadow-2xl flex flex-col items-center text-white relative">
        
        <h1 id="statusTitle" class="text-2xl font-extrabold mb-2 tracking-wide">READY TO SCAN</h1>
        <p id="statusMessage" class="text-sm opacity-90 mb-4">QR кодоо камерын өмнө барина уу...</p>

        <!-- CAMERA BOX CONTAINER -->
        <div id="cameraContainer" class="w-full bg-black rounded-2xl overflow-hidden shadow-inner relative flex items-center justify-center" style="min-height: 280px;">
            <div id="reader" class="w-full"></div>
        </div>

        <!-- MESSAGE / RESULT DISPLAY -->
        <div id="resultBox" class="mt-4 text-sm font-semibold hidden p-3 rounded-xl w-full"></div>
    </div>

    <!-- Back to Dashboard Link -->
    <div class="absolute bottom-6 left-6">
        <a href="index.html" class="bg-white/20 hover:bg-white/30 text-white px-4 py-2 rounded-lg text-sm transition font-medium">&larr; Dashboard руу буцах</a>
    </div>

    <!-- Firebase SDK & Scanner Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJIliExwHKou9wyckX3_STlA1YIPNhI0",
            authDomain: "qr-reg-aaadc.firebaseapp.com",
            projectId: "qr-reg-aaadc",
            storageBucket: "qr-reg-aaadc.firebasestorage.app",
            messagingSenderId: "1062255210388",
            appId: "1:1062255210388:web:5fb8d6fb47b3a3a029e981",
            measurementId: "G-52EVTSYT57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const bodyBg = document.getElementById("bodyBg");
        const statusTitle = document.getElementById("statusTitle");
        const statusMessage = document.getElementById("statusMessage");
        const cameraContainer = document.getElementById("cameraContainer");
        const resultBox = document.getElementById("resultBox");

        let html5QrCode = null;
        let isProcessing = false;
        let resetTimer = null;

        // Beep дуу гаргах
        function playSound(isSuccess) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(isSuccess ? 800 : 300, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + (isSuccess ? 0.15 : 0.4));
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        // Дэлгэцийн төлөв өөрчлөх (Ногоон / Улаан болгох үед камерыг түр нуух)
        function setIndicatorState(type, title, message) {
            bodyBg.classList.remove("bg-blue-900", "bg-green-600", "bg-red-600");
            
            if (type === 'SUCCESS') {
                bodyBg.classList.add("bg-green-600");
                playSound(true);
                cameraContainer.classList.add("hidden"); // Камерын хэсгийг нууж том өнгө гаргах
                resultBox.classList.remove("hidden", "bg-red-500/30");
                resultBox.classList.add("bg-green-500/30");
            } else if (type === 'ERROR') {
                bodyBg.classList.add("bg-red-600");
                playSound(false);
                cameraContainer.classList.add("hidden");
                resultBox.classList.remove("hidden", "bg-green-500/30");
                resultBox.classList.add("bg-red-500/30");
            } else {
                bodyBg.classList.add("bg-blue-900");
                cameraContainer.classList.remove("hidden"); // Камерын хэсгийг буцааж гаргах
                resultBox.classList.add("hidden");
            }

            statusTitle.textContent = title;
            statusMessage.textContent = message;
            resultBox.textContent = message;

            if (resetTimer) clearTimeout(resetTimer);

            // 4 секундын дараа буцаад камертай хэвийн байдал руу орох
            if (type !== 'IDLE') {
                resetTimer = setTimeout(() => {
                    setIndicatorState('IDLE', 'READY TO SCAN', 'QR кодоо камерын өмнө барина уу...');
                    isProcessing = false;
                }, 4000);
            }
        }

        // QR код уншигдахад Firebase руу хандах
        async function processScan(userId) {
            userId = userId.trim();
            if (!userId || isProcessing) return;
            isProcessing = true;

            try {
                const userRef = doc(db, "users", userId);
                const docSnap = await getDoc(userRef);

                if (docSnap.exists()) {
                    await updateDoc(userRef, {
                        status: "ACTIVE",
                        lastScanned: new Date().toLocaleString()
                    });
                    setIndicatorState('SUCCESS', 'SUCCESS!', `User "${userId}" Checked In!`);
                } else {
                    setIndicatorState('ERROR', 'NOT FOUND', `User "${userId}" бүртгэлгүй байна!`);
                }
            } catch (err) {
                setIndicatorState('ERROR', 'ERROR', err.message);
            }
        }

        // Камер асаах
        function startScanner() {
            html5QrCode = new Html5Qrcode("reader");
            Html5Qrcode.getCameras().then(devices => {
                if (devices && devices.length) {
                    const cameraId = devices[0].id;
                    html5QrCode.start(
                        cameraId,
                        { fps: 10, qrbox: { width: 220, height: 220 } },
                        (decodedText) => {
                            if (!isProcessing) {
                                processScan(decodedText);
                            }
                        },
                        (errorMessage) => {}
                    ).catch(err => {
                        console.log("Camera start error: ", err);
                    });
                }
            }).catch(err => {
                console.log("Camera permission error: ", err);
            });
        }

        // Хуудас ачаалагдахад камер шууд автоматаар асарна
        window.addEventListener("load", () => {
            startScanner();
        });
    </script>
</body>
</html>
