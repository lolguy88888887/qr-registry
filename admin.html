<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Create User Account</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6">
        <h1 class="text-2xl font-bold text-gray-800 mb-2 text-center">Admin User Creator</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Add a new user credential to your database.</p>

        <form id="createForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">User ID / Username</label>
                <input type="text" id="userId" placeholder="e.g. user123" required class="w-full border rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Full Name</label>
                <input type="text" id="userName" placeholder="e.g. John Doe" required class="w-full border rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Password / Passcode</label>
                <input type="password" id="userPassword" placeholder="Enter account password" required class="w-full border rounded-lg px-4 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition">Create User Account</button>
        </form>

        <div id="resultMessage" class="mt-4 text-sm font-medium text-center"></div>

        <div class="mt-6 text-center space-x-4">
            <a href="index.html" class="text-indigo-600 text-sm hover:underline">Dashboard</a>
            <span class="text-gray-300">|</span>
            <a href="login.html" class="text-indigo-600 text-sm hover:underline">User Login</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJIliExwHKou9wyckX3_STlA1YIPNhI0",
            authDomain: "qr-reg-aaadc.firebaseapp.com",
            projectId: "qr-reg-aaadc",
            storageBucket: "qr-reg-aaadc.firebasestorage.app",
            messagingSenderId: "1062255210388",
            appId: "1:1062255210388:web:5fb8d6fb47b3a3a029e981",
            measurementId: "G-52EVTSYT57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const msgDiv = document.getElementById("resultMessage");

        document.getElementById("createForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const userId = document.getElementById("userId").value.trim();
            const name = document.getElementById("userName").value.trim();
            const password = document.getElementById("userPassword").value.trim();

            if (!userId || !name || !password) return;

            try {
                // Saves user document with password, initial status, and name
                await setDoc(doc(db, "users", userId), {
                    name: name,
                    password: password,
                    status: "DEACTIVE",
                    lastScanned: "Never"
                });

                msgDiv.className = "mt-4 text-sm font-medium text-green-600";
                msgDiv.textContent = `Success! User account "${userId}" created.`;
                document.getElementById("createForm").reset();
            } catch (err) {
                msgDiv.className = "mt-4 text-sm font-medium text-red-600";
                msgDiv.textContent = "Error: " + err.message;
            }
        });
    </script>
</body>
</html>
