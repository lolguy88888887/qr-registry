<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My QR Pass</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">My Digital QR Pass</h1>
        <p class="text-sm text-gray-500 mb-6">Enter your User ID to generate your personal badge.</p>

        <div class="space-y-4 mb-6">
            <input type="text" id="userIdInput" placeholder="Enter your User ID..." class="w-full border rounded-lg px-4 py-2 text-center text-sm focus:ring-2 focus:ring-green-500 outline-none">
            <button id="generateBtn" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold hover:bg-green-700">Generate Pass</button>
        </div>

        <!-- QR Code Container -->
        <div class="flex justify-center my-4">
            <div id="qrcode" class="p-4 bg-white border rounded-lg shadow-inner inline-block"></div>
        </div>

        <div class="mt-6">
            <a href="dashboard.html" class="text-green-600 text-sm hover:underline">&larr; Back to Dashboard</a>
        </div>
    </div>

    <script>
        const qrcodeContainer = document.getElementById("qrcode");
        let qrCodeInstance = null;

        document.getElementById("generateBtn").addEventListener("click", () => {
            const userId = document.getElementById("userIdInput").value.trim();
            if (!userId) {
                alert("Please enter a valid User ID.");
                return;
            }

            // Clear previous QR code if any
            qrcodeContainer.innerHTML = "";
            
            // Generate new QR code
            qrCodeInstance = new QRCode(qrcodeContainer, {
                text: userId,
                width: 180,
                height: 180,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        });
    </script>
</body>
</html>
