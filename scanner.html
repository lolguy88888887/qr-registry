<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Scanner with Sound</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full bg-white rounded-xl shadow-md p-6 text-center">
        <h1 class="text-2xl font-bold text-gray-800 mb-2">QR Code Scanner</h1>
        <p class="text-sm text-gray-500 mb-4">Select your camera source below.</p>

        <!-- Camera Selector Dropdown -->
        <div class="mb-4">
            <label class="block text-xs font-semibold text-gray-600 mb-1 text-left">Choose Camera:</label>
            <select id="cameraSelect" class="w-full border rounded-lg px-3 py-2 text-sm bg-white focus:ring-2 focus:ring-blue-500 outline-none">
                <option value="">-- Detect available cameras --</option>
            </select>
        </div>

        <!-- Camera Viewfinder Box -->
        <div id="reader" class="w-full mb-4 overflow-hidden rounded-lg border bg-black" style="min-height: 250px;"></div>

        <!-- Manual Input Alternative -->
        <div class="space-y-4">
            <input type="text" id="scanInput" placeholder="Or type User ID manually..." class="w-full border rounded-lg px-4 py-2 text-center text-sm focus:ring-2 focus:ring-blue-500 outline-none">
            <button id="submitScan" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700">Submit ID Manually</button>
        </div>

        <div id="resultMessage" class="mt-4 text-sm font-medium"></div>

        <div class="mt-6">
            <a href="index.html" class="text-blue-600 text-sm hover:underline">&larr; Back to Dashboard</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDMJIliExwHKou9wyckX3_STlA1YIPNhI0",
            authDomain: "qr-reg-aaadc.firebaseapp.com",
            projectId: "qr-reg-aaadc",
            storageBucket: "qr-reg-aaadc.firebasestorage.app",
            messagingSenderId: "1062255210388",
            appId: "1:1062255210388:web:5fb8d6fb47b3a3a029e981",
            measurementId: "G-52EVTSYT57"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const msgDiv = document.getElementById("resultMessage");
        const cameraSelect = document.getElementById("cameraSelect");
        let html5QrCode = null;
        let isProcessing = false;

        // Beep дуу тоглуулах функц (Ямар нэгэн MP3 файл шаардлагагүй)
        function playSuccessBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                oscillator.type = "sine";
                oscillator.frequency.setValueAtTime(800, audioCtx.currentTime); // Дууны өндөр давтамж
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime); // Дууны чанга яригч түвшин

                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15); // 0.15 секунд үргэлжлэнэ
            } catch (e) {
                console.log("Audio context blocked or unsupported", e);
            }
        }

        async function processUserScan(userId) {
            userId = userId.trim();
            if (!userId || isProcessing) return;
            isProcessing = true;

            try {
                const userRef = doc(db, "users", userId);
                const docSnap = await getDoc(userRef);

                if (docSnap.exists()) {
                    const timestamp = new Date().toLocaleString();
                    await updateDoc(userRef, {
                        status: "ACTIVE",
                        lastScanned: timestamp
                    });
                    
                    // Амжилттай уншигдахад дуу гаргана
                    playSuccessBeep();

                    msgDiv.className = "mt-4 text-sm font-medium text-green-600";
                    msgDiv.textContent = `Success! User "${userId}" marked ACTIVE.`;
                } else {
                    msgDiv.className = "mt-4 text-sm font-medium text-red-600";
                    msgDiv.textContent = `Error: User ID "${userId}" not found.`;
                }
            } catch (err) {
                msgDiv.className = "mt-4 text-sm font-medium text-red-600";
                msgDiv.textContent = "Error: " + err.message;
            } finally {
                setTimeout(() => { isProcessing = false; }, 2500);
            }
        }

        // Manual buttons
        document.getElementById("submitScan").addEventListener("click", () => {
            processUserScan(document.getElementById("scanInput").value);
        });

        document.getElementById("scanInput").addEventListener("keypress", (e) => {
            if (e.key === "Enter") processUserScan(e.target.value);
        });

        function startScanner(cameraId) {
            if (html5QrCode && html5QrCode.isScanning) {
                html5QrCode.stop().then(() => {
                    initCamera(cameraId);
                }).catch(err => console.log(err));
            } else {
                initCamera(cameraId);
            }
        }

        function initCamera(cameraId) {
            html5QrCode = new Html5Qrcode("reader");
            html5QrCode.start(
                cameraId,
                { fps: 10, qrbox: 250 },
                (decodedText) => {
                    processUserScan(decodedText);
                },
                (errorMessage) => {}
            ).catch(err => {
                msgDiv.className = "mt-4 text-sm font-medium text-orange-500";
                msgDiv.textContent = "Could not start selected camera: " + err;
            });
        }

        Html5Qrcode.getCameras().then(devices => {
            if (devices && devices.length) {
                cameraSelect.innerHTML = "";
                devices.forEach(device => {
                    const option = document.createElement("option");
                    option.value = device.id;
                    option.text = device.label || `Camera ${cameraSelect.length + 1}`;
                    cameraSelect.appendChild(option);
                });

                startScanner(devices[0].id);

                cameraSelect.addEventListener("change", (e) => {
                    startScanner(e.target.value);
                });
            } else {
                msgDiv.className = "mt-4 text-sm font-medium text-red-500";
                msgDiv.textContent = "No cameras found on this device.";
            }
        }).catch(err => {
            msgDiv.className = "mt-4 text-sm font-medium text-red-500";
            msgDiv.textContent = "Camera permission error: " + err;
        });
    </script>
</body>
</html>
